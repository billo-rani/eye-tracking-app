<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto+Slab:wght@100..900&family=Rubik+Spray+Paint&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>App for paralysed</title>
</head>
<body>
    <section>
        <video id="webcam" autoplay playsinline style="width: 320px; height: 240px; border: 2px solid #333; margin-bottom: 20px;"></video>
        <div id="calibration-panel" style="display: none; text-align: center; margin-bottom: 20px;">
    <h2>Calibration Mode</h2>
    <p>Look at the dots and blink when you see them.</p>
    <div id="calibration-dots" style="position: relative; width: 100%; height: 300px; border: 2px dashed #ccc;">
    </div>
    <button id="start-calibration" class="button" style="background-color: orange; font-size: 20px;">Start Calibration</button>
    <button id="save-calibration" class="button" style="background-color: green; font-size: 20px; display: none;">Save & Finish</button>
</div>
        <div class="buttons">
            <button id="button1" class="button">water</button>
            <button id="button2" class="button">help</button>
            <button id="button3" class="button">no</button>
            <button id="button4" class="button">yes</button>
        </div>
    </section>
    <script src="index.js"></script>
</body>
</html>
